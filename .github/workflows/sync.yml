name: Sync YouTube to Podcast

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      playlist_limit:
        description: 'Max videos to check (default: 50)'
        required: false
        default: '50'

permissions:
  contents: write   # needed to create releases and push to gh-pages

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # livestreams can be long; give ffmpeg time

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install yt-dlp
        run: pip install --upgrade yt-dlp

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o yt-to-podcast .

      - name: Run sync
        env:
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER:  ${{ github.repository_owner }}
          GITHUB_REPO:   ${{ github.event.repository.name }}
          FEED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          YT_PLAYLIST_LIMIT: ${{ github.event.inputs.playlist_limit || '50' }}
        run: ./yt-to-podcast
